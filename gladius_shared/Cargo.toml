[package]
name = "gladius_shared"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
json_schema_gen = ["dep:schemars"]
doc_constants = ["dep:documented"]

[dependencies]
zip = { version = "2.4.2", features = ["bzip2", "deflate", "deflate64", "lzma", "time", "xz", "zstd"], default-features = false }

nom_stl = "0.2.2"
serde = { version = "1.0", features = ["derive"] }

quick-xml = { version = "0.37", features = ["serialize"]}
geo-3d = {version = "0.31", features = ["use-serde"], git = "https://github.com/TimTheBig/geo-3d.git" }
csgrs = { git = "https://github.com/TimTheBig/csgrs.git", version = "0.17.0", branch = "fix" }
nalgebra = "0.33"
deser-hjson = "2.2"
serde_json = "^1.0.85"
itertools = "0.14"
gladius_proc_macros = { path = "./gladius_proc_macros" }

log = "0.4"
documented = { version = "0.9", optional = true }

# json schema gen
[dependencies.schemars]
version = "1.0.0-alpha.17"
git = "https://github.com/TimTheBig/schemars.git"
branch = "geo0.29"
features = ["geo029"]
optional = true
